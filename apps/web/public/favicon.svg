<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lacuna app icon.
       Folder tab + layered sheets (ref 1), storage grid on cream (ref 2),
       magnifying lens with handle (ref 3), layered offset ring (ref 4).
       Palette: ink, sage, cream, teal glass. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b332e"/>
      <stop offset="1" stop-color="#0f1311"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfaf4"/>
      <stop offset="1" stop-color="#ece5d6"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c2b0"/>
      <stop offset="1" stop-color="#6f9079"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#d9f3ef" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8fcfc6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f9b91" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a423d"/>
      <stop offset="1" stop-color="#121614"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="640" cy="640" r="168"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="cells">
      <rect x="250" y="430" width="150" height="98" rx="22" fill="#1d2420"/>
      <rect x="425" y="430" width="150" height="98" rx="22" fill="#86a690"/>
      <rect x="600" y="430" width="150" height="98" rx="22" fill="#c7d6ca"/>
      <rect x="250" y="547" width="150" height="98" rx="22" fill="#86a690"/>
      <rect x="425" y="547" width="150" height="98" rx="22" fill="#c7d6ca"/>
      <rect x="600" y="547" width="150" height="98" rx="22" fill="#e4ddcc"/>
      <rect x="250" y="664" width="150" height="98" rx="22" fill="#c7d6ca"/>
      <rect x="425" y="664" width="150" height="98" rx="22" fill="#e4ddcc"/>
      <rect x="600" y="664" width="150" height="98" rx="22" fill="#e4ddcc"/>
    </g>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>

  <!-- folder back with tab -->
  <path d="M200 300a50 50 0 0 1 50-50h170c45 0 60 50 105 50h225a50 50 0 0 1 50 50v400H200z" fill="url(#folder)"/>
  <!-- layered sheets -->
  <rect x="232" y="322" width="536" height="120" rx="26" fill="#ddd5c3"/>
  <rect x="248" y="346" width="504" height="120" rx="26" fill="#f4efe3"/>

  <!-- front card with storage grid -->
  <g filter="url(#shadow)">
    <rect x="200" y="380" width="600" height="440" rx="64" fill="url(#card)"/>
  </g>
  <use href="#cells"/>

  <!-- lens: layered offset ring, magnified grid, glass, handle -->
  <line x1="770" y1="770" x2="884" y2="884" stroke="url(#handle)" stroke-width="74" stroke-linecap="round" filter="url(#shadow)"/>
  <line x1="788" y1="780" x2="872" y2="864" stroke="#4b5650" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <circle cx="664" cy="640" r="190" fill="none" stroke="#5f8a73" stroke-width="44"/>
  <g clip-path="url(#lens)">
    <rect x="440" y="440" width="400" height="400" fill="#f6f2e8"/>
    <use href="#cells" transform="translate(640 640) scale(1.6) translate(-470 -520)"/>
    <circle cx="640" cy="640" r="168" fill="url(#glass)"/>
    <path d="M520 560a130 130 0 0 1 110-92" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  </g>
  <circle cx="640" cy="640" r="190" fill="none" stroke="#f3f6f2" stroke-width="44" filter="url(#shadow)"/>
  <circle cx="640" cy="640" r="168" fill="none" stroke="#cfdad2" stroke-width="4"/>
</svg>
