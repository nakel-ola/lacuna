[package]
name = "lacuna"
version = "0.1.0"
description = "Lacuna: disk space analyzer"
edition = "2021"
license = "MIT"

[lib]
name = "lacuna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
libc = "0.2"
plist = "1"
blake3 = { version = "1", features = ["rayon"] }
memmap2 = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSArray", "NSDictionary", "NSValue", "NSError", "NSObject"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Hashing is the hot loop of the duplicate search: keep it fast in `pnpm dev` too.
[profile.dev.package.blake3]
opt-level = 3
